name: Python Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn xgboost lightgbm psutil pyyaml

    - name: Run unit tests
      run: |
        python -m unittest tests.test_auto_train -v

    - name: Run integration tests
      run: |
        python -m unittest tests.test_integration -v

    - name: Run all tests
      run: |
        python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install linting tools
      run: |
        pip install flake8 pylint

    - name: Run flake8
      run: |
        flake8 scripts/auto_train.py --max-line-length=120

    - name: Run pylint
      run: |
        pylint scripts/auto_train.py --disable=all --enable=E,W,F
