name: Python Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 单 job 失败不取消其余矩阵，避免级联取消吞掉其他环境的真实结果
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (Continuous Locking, C-20260928-035)
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools
        # C-20260928-035: CI 用 pip-compile 生成精确版本 lock 文件（不入仓，.gitignore 已排除）
        # 解决"不锁版本，CI 重现性不足"风险；lock 每次随 push 刷新无需人工维护
        pip-compile --no-emit-options --output-file=requirements.lock requirements.txt
        pip install -r requirements.lock
        # 依赖唯一事实来源仍为 requirements.txt，新增第三方 import 必须同步该文件

    - name: Prepare runtime dirs
      run: |
        python -c "import os; [os.makedirs(d, exist_ok=True) for d in ('logs', 'data', 'output')]"

    - name: Run tests
      run: |
        python -m pytest tests -v

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true  # 存量代码告警多，lint 暂不阻断 CI，仅作报告；测试 job 保持严格
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install linting tools
      run: |
        pip install flake8 pylint

    - name: Run flake8
      run: |
        flake8 scripts features modules collection --max-line-length=120

    - name: Run pylint
      run: |
        pylint scripts features modules collection --disable=all --enable=E,W,F

  audit:
    # C-20260928-035: 依赖 CVE 安全扫描（独立 job，发现已知漏洞即阻断 CI）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Audit dependencies for CVE
      run: |
        # 扫描 requirements.txt 中的依赖是否有已知 CVE
        # 数据源：PyPI Advisory Database + OSV.dev
        # 发现任何已知漏洞时退出码非零，阻断 CI（推动开发者升级或显式 --ignore-vuln）
        pip-audit -r requirements.txt
