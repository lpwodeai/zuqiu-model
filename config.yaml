training:
  # feature_time_decay: 用于特征工程内部的滚动统计窗口（球队历史胜率/进球）
  feature_time_decay:
    enabled: true
    decay_type: exponential
    half_life_days: 14
    min_weight: 0.01
    max_history_days: 90
  # sample_time_decay: 用于训练 sample_weight 的赛季级时间衰减（方案C/D）
  sample_time_decay:
    enabled: true
    # 自动模式：根据最新比赛日期与最近赛季样本量，在"方案C-温和衰减（休赛期）"和"方案D-平衡衰减（赛中）"之间自动切换
    auto_mode: true
    # 切换阈值：当最近赛季(0-365天)样本 >= mid_season_sample_threshold 时，自动切到方案D
    mid_season_sample_threshold: 1000
    # 方案C — 温和衰减（休赛期/赛季初，优先保障样本量）
    profile_c:
      enabled: true
      decay_type: exponential
      half_life_days: 365
      min_weight: 0.01
      max_history_days: 1095
    # 方案D — 平衡衰减（赛季中期，近赛季样本充足时）
    profile_d:
      enabled: true
      decay_type: exponential
      half_life_days: 180
      min_weight: 0.01
      max_history_days: 730
    # 手动覆盖：若提供则优先使用该配置
    manual:
      enabled: false
      decay_type: exponential
      half_life_days: 365
      min_weight: 0.01
      max_history_days: 1095
  # 联赛补偿：德甲/法甲每赛季仅306场 vs 英/西/意380场，结构性弱势需要补偿
  league_compensation:
    enabled: true
    default_weight: 1.0
    weights:
      英超: 1.0
      西甲: 1.0
      意甲: 1.0
      德甲: 1.20
      法甲: 1.20
    # 全局联赛阶层权重文件（保留向后兼容）
    tier_weight_file: 'assets/league_tier_weight.json'
  incremental:
    enabled: true
    batch_size: 100
  class_weight:
    enabled: true
  validation_split: 0.2
  # score_matrix_tuning: 比分矩阵参数调优 (论文策略2+3)
  # 用于 Dixon-Coles 比分矩阵构建和尾部候选增强
  score_matrix_tuning:
    # 启用 ρ × lambda_boost 联合网格搜索
    grid_search:
      enabled: true
      # ρ 搜索范围 (Dixon-Coles 低比分修正参数)
      rho_grid: [-0.25, -0.30, -0.35, -0.40, -0.45]
      # lambda_boost 搜索范围 (λ 放大系数，解决中比分Top-1=0%问题)
      lambda_boost_grid: [1.2, 1.5, 1.8, 2.2, 2.6, 3.0]
      # 优化目标: 综合评分 (40% Top-3 + 30% 中比分Top-3 + 30% 高比分Top-3)
      optimization_target: composite_score
      # 综合评分权重
      composite_weights:
        overall_top3: 0.4
        mid_score_top3: 0.3
        high_score_top3: 0.3
    # 最优参数 (由综合评分网格搜索填充)
    optimal_params:
      rho: -0.45
      lambda_boost: 3.0
    # 尾部候选增强配置 (论文策略3增强版v2)
    tail_anchor_injection:
      enabled: true
      # 高比分锚点注入: λ_sum > 2.2 时触发 (放宽阈值)
      lambda_sum_threshold: 2.2
      # 大分差锚点注入: λ_diff > 0.5 时触发 (放宽阈值)
      lambda_diff_threshold: 0.5
      # 自适应 max_goals: λ_sum > 3.5 时使用 8, 否则 7
      adaptive_max_goals_threshold: 3.5
      # 高比分锚点候选池 (覆盖 5+ 球比分)
      high_score_anchors:
        - [2, 3]
        - [3, 2]
        - [3, 3]
        - [2, 4]
        - [4, 2]
        - [3, 4]
        - [4, 3]
        - [4, 4]
        - [1, 4]
        - [4, 1]
        - [2, 2]
        - [1, 3]
        - [3, 1]
      # 大分差锚点 (主胜场景)
      big_diff_home_anchors:
        - [3, 0]
        - [4, 0]
        - [3, 1]
        - [4, 1]
        - [2, 0]
        - [2, 1]
        - [1, 0]
      # 大分差锚点 (客胜场景)
      big_diff_away_anchors:
        - [0, 3]
        - [0, 4]
        - [1, 3]
        - [1, 4]
        - [0, 2]
        - [1, 2]
        - [0, 1]
