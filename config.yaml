# ============================================================
# C-20260823-P0: 比赛条件特征（修复天气/伤病硬编码默认值）
# 优先级: Python match_condition_features.py 生成 > 硬编码默认值
# ============================================================
match_conditions:
  enabled: true
  # 伤病因子（基于 SofaScore 球员出场数据）
  injury:
    enabled: true
    # 核心球员判定: 近 N 场出场率 > 60% 且评分前 5
    core_player:
      min_appearance_rate: 0.6
      top_n_rating: 5
    # 扣减因子范围
    impact_range:
      min: 0.85       # 最严重缺阵时攻击力扣减到 85%
      max: 1.0        # 全员健康时无扣减
    # 缺阵球员 xG 占比 → 扣减因子映射
    missing_xg_factor: 0.3  # 缺阵 xG 占比 × 0.3 = 扣减比例
    core_missing_factor: 0.2  # 核心球员缺阵率 × 0.2 = 额外扣减
  # 天气因子（降级方案: 联赛-月份气候均值）
  weather:
    enabled: true
    # 气候均值数据源: LEAGUE_MONTH_CLIMATE (1991-2020 30年均值)
    data_source: climate_estimate
    # 未来接入实时天气 API 时切换为 live_weather
    # api_endpoint: ${WEATHER_API_ENDPOINT}
    # api_key: ${WEATHER_API_KEY}
    # 影响因子范围
    impact_range:
      attack_min: 0.80
      attack_max: 1.0
      defence_min: 1.0
      defence_max: 1.20
    # 天气类型阈值
    thresholds:
      heavy_rain_prob: 0.6
      rain_prob: 0.35
      cloudy_prob: 0.15
      extreme_wind: 25
      wind: 18
      snow_temp: 1
      fog_temp: 5

# ============================================================
# C-20260823-P0-4: 统一比分-胜平负预测引擎
# Dixon-Coles 比分矩阵 → 统一导出 WDL / 让球 / 大小球 / 精确比分
# ============================================================
unified_engine:
  enabled: true  # C-20260909-007 灰度开启（统一引擎 C→A→B 已实施，验证见 change_log）
  fallback_legacy: true  # 失败时回退到旧 T-005/T-006 架构
  dixon_coles:
    rho_default: -0.30  # 默认 ρ（对齐 T006_RHO，低比分平局修正）
    max_goals: 7  # 最大进球截断（对齐 T-006 max_goals=7）
    leagues:
      英超: -0.08
      西甲: -0.12
      意甲: -0.15
      德甲: -0.05
      法甲: -0.10
  # ML 回归 λ 的训练目标
  training:
    objective: count:poisson  # Poisson 回归（而非平方误差）
    lambda_home_col: expected_home_goals
    lambda_away_col: expected_away_goals

# ============================================================
# P1-10: EV 决策引擎全局配置（第二层决策层，D3 运行时读取）
# generate_unified_report.py 预测时读取本段并写入 model_predictions
# （ev_threshold_used / kelly_strategy），避免阈值/仓位参数散落硬编码。
# ============================================================
ev:
  ev_threshold_default: 0.02       # EV 入场阈值（如回测发现联赛最优阈值不同，改此处即可）
  kelly_default_strategy: quarter  # full / half / quarter
  kelly_upper_cap: 0.25            # 单场凯利建议仓位上限（0-1）
