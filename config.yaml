# 平局决策阈值因子：不修改概率，仅调整分类决策
# 语义: factor<=0 或 =1.0 等价 argmax；0<factor<1 反压低平局（抬高平局门槛）；factor>1 上浮平局
# C-20260820-036(重训): 用修复后 209 维 pipeline 重训（lgb_model_20260820_190130），消除列不一致
# C-20260820-037(完整网格重校准): 网格 [0.80~1.10] 逐联赛校准——高平局联赛「反压低平局」可提升准确率
#   各联赛实际平局率: 意甲 28.1% > 西甲 26.0% > 德甲 25.5% > 英超 24.5% > 法甲 23.8%
#   准确率最优: 西甲 0.80(+1.05pp) / 意甲 0.85(+0.97pp) / 德甲 0.85(+0.87pp) / 英超·法甲 argmax
#   全局 argmax(1.0)=55.16%，最优 0.90=55.25%(+0.09pp 处于噪声区间，默认仍取 1.0)
# 平局阈值模式: argmax(默认,全局) / league_specific(逐联赛因子) — 切换此处即可，无需改代码 (D3: JS 运行时读取本文件)
draw_threshold_mode: argmax
draw_threshold_factor: 1.0
draw_threshold_factor_league:
  FL1: 0.0    # 法甲 — argmax（上浮/反压均无收益）            (C-20260820-037)
  BL1: 0.85   # 德甲 — 反压低平局 +0.87pp                    (C-20260820-037)
  IT: 0.85    # 意甲 — 反压低平局 +0.97pp                    (C-20260820-037)
  LaLiga: 0.80 # 西甲 — 反压低平局 +1.05pp                    (C-20260820-037)
  PL: 0.0     # 英超 — argmax（上浮/反压均无收益）            (C-20260820-037)

# C-20260816-208: Poisson λ 增强参数 — 赛后复盘验证通过
# 基于西甲第1轮两场比赛复盘: 旧 λ 系统性低估 (+0.64~+1.77), 实际进球均超预期
# 验证结果 (阿拉维斯 vs 赫塔费): 期望总进球 1.42→2.01, 大球概率 17.1%→32.6%, 主胜置信度 30.0%→33.4%
lambda_adjustment:
  # P0: 赛季前3轮 λ 自动上浮 25% — 补偿新赛季阵容磨合不确定性
  season_boost:
    enabled: true
    max_round: 3          # 前3轮生效
    factor: 1.25           # λ 乘数
  # P1: 赔率时序信号作为 λ 调整因子 — 市场资金流向反映预期进球方向
  odds_trend_boost:
    enabled: true
    home_down: 1.05        # 主胜赔率↓ → 主队 λ ×1.05
    draw_down: 1.03        # 平局赔率↓ → 双方 λ ×1.03
    away_up: 0.95          # 客胜赔率↑ → 客队 λ ×0.95
  # P1: 联赛专属 λ 基线上调 — 西甲场均进球 2.67 高于模型基准
  league_boost:
    LaLiga: 1.10           # 西甲 λ ×1.10
    # 预留: PL/BL1/IT/FL1 当前为 1.0 (不调整)
  # P1: 比分分布拓宽 — 覆盖长尾冷门比分 (3:0/4:0)
  poisson_max_goals: 10    # 旧值 7 → 新值 10

